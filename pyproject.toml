[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-terminal"
version = "0.1.0"
description = "A cross-platform desktop terminal emulator built with Python and Qt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "pyte>=0.8.2",
    "pywinpty>=2.0; platform_system == 'Windows'",
]

[project.scripts]
unified-terminal = "unified_terminal.__main__:main"

[project.urls]
Homepage = "https://github.com/Unified-Termial/unified-terminal"
Repository = "https://github.com/Unified-Termial/unified-terminal"
Releases = "https://github.com/Unified-Termial/unified-terminal/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/unified-terminal" = ["assets/UT.png", "assets/UT.ico"]
